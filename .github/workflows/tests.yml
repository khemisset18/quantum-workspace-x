name: Python checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run numerical tests
        run: python quantum_workspace_tests_01.py
      - name: Run experiment
        run: python quantum_workspace_theorie_01.py
